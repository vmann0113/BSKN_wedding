<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>업체 파트너 센터 · 웨딩여기</title>
<link rel="icon" type="image/jpeg" href="./icon.jpg">
<link rel="apple-touch-icon" href="./icon.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
@font-face{font-family:'Paperlogy';font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:800;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2')}

*{box-sizing:border-box}
:root{--sab:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{font-family:'Paperlogy','Pretendard',system-ui,-apple-system,sans-serif;background:#f4f3f6;color:#2b2530;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,a{-webkit-tap-highlight-color:rgba(255,77,109,.12);touch-action:manipulation}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:#ff4d6d;text-decoration:none}
a:hover{color:#e03e5c}
img{max-width:100%}

/* header */
header{position:sticky;top:0;z-index:80;background:#fff;border-bottom:1px solid #ecebf0}
.hrow{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px clamp(14px,3vw,28px);min-width:0}
.brand{display:flex;align-items:center;gap:9px;color:#2b2530;min-width:0}
.brand i{width:32px;height:32px;border-radius:10px;overflow:hidden;flex:none;display:block}
.brand i img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-size:16px;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:11px;color:#a49dae;font-weight:700;margin-top:1px}
.hsp{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.hbtn{background:#fff;border:1px solid #e6e3ec;border-radius:10px;padding:9px 13px;font-size:13px;font-weight:700;color:#2b2530}
.hbtn.primary{background:#ff4d6d;border-color:#ff4d6d;color:#fff}
.hbtn:hover{border-color:#d9d4e2}
.hbtn.primary:hover{background:#f03b5c}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:clamp(18px,3vw,34px) clamp(14px,3vw,28px) 80px}
.card{background:#fff;border:1px solid #ecebf0;border-radius:18px;padding:clamp(18px,2.6vw,26px)}
.card + .card{margin-top:16px}
h1.pt{font-size:clamp(22px,3.4vw,30px);font-weight:800;margin:0 0 8px;line-height:1.3}
p.sub{margin:0;font-size:14px;line-height:1.75;color:#6b6475}
h2.sec{font-size:17px;font-weight:800;margin:0 0 4px}
.seclead{font-size:13px;color:#8d8697;margin:0 0 18px;font-weight:600}

/* forms */
.field{margin-bottom:15px}
.field > label{display:block;font-size:12.5px;font-weight:800;color:#4a4550;margin-bottom:7px}
.field .req{color:#ff4d6d;margin-left:3px}
.field .hint{font-size:11.5px;color:#a49dae;font-weight:600;margin-top:6px;line-height:1.6}
.inp,select.inp,textarea.inp{width:100%;background:#faf9fb;border:1px solid #e6e3ec;border-radius:12px;padding:13px 14px;font-size:15px;font-weight:500;color:#2b2530;outline:none}
.inp:focus{border-color:#ff4d6d;background:#fff}
textarea.inp{resize:vertical;min-height:96px;line-height:1.7}
.row{display:grid;gap:12px}
.row.c2{grid-template-columns:1fr 1fr}
.row.c3{grid-template-columns:repeat(3,1fr)}
.pillrow{display:flex;flex-wrap:wrap;gap:8px}
.pill{background:#faf9fb;border:1px solid #e6e3ec;border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:700;color:#4a4550}
.pill.on{background:#2b2530;border-color:#2b2530;color:#fff}
.pill.rose.on{background:#ff4d6d;border-color:#ff4d6d}
.btn{border:none;border-radius:13px;padding:14px 20px;font-size:15px;font-weight:800;background:#ff4d6d;color:#fff}
.btn:hover{background:#f03b5c}
.btn.ghost{background:#f4f3f6;color:#2b2530}
.btn.ghost:hover{background:#ebe9ef}
.btn.line{background:#fff;border:1px solid #e6e3ec;color:#2b2530}
.btn:disabled{background:#f2f0f5;color:#b6aebd;cursor:not-allowed}
.btnrow{display:flex;gap:10px;margin-top:22px}
.btnrow .btn{flex:1}
.err{background:#fff1f3;border:1px solid #ffd3da;color:#c3283f;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;line-height:1.6;margin-bottom:14px}
.ok{background:#eefaf3;border:1px solid #c9edd8;color:#1c7a4a;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:14px}

/* stepper */
.steps{display:flex;gap:6px;margin-bottom:22px}
.steps div{flex:1;height:5px;border-radius:99px;background:#ecebf0}
.steps div.on{background:#ff4d6d}
.stepno{font-size:12px;font-weight:800;color:#ff4d6d;margin-bottom:6px}

/* vendor list */
.vlist{display:grid;gap:12px}
.vrow{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid #ecebf0;border-radius:16px;padding:14px}
.vthumb{width:64px;height:64px;border-radius:12px;background:#f0eef4;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:22px}
.vmeta{flex:1;min-width:0}
.vmeta b{display:block;font-size:15.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vmeta span{display:block;font-size:12.5px;color:#8d8697;font-weight:600;margin-top:3px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:800;flex:none}
.b-draft{background:#f2f0f5;color:#7d7589}
.b-pending{background:#fff5e6;color:#a86a00}
.b-approved{background:#eefaf3;color:#1c7a4a}
.b-rejected{background:#fff1f3;color:#c3283f}
.b-suspended{background:#eceaf1;color:#5d5668}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.gcell{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#f0eef4;border:1px solid #ecebf0}
.gcell img{width:100%;height:100%;object-fit:cover;display:block}
.gcell button{position:absolute;top:5px;right:5px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(20,14,26,.62);color:#fff;font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center}
.drop{border:1.5px dashed #d9d4e2;border-radius:12px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#faf9fb;color:#a49dae;font-size:12px;font-weight:700;text-align:center;padding:8px}
.drop:hover{border-color:#ff4d6d;color:#ff4d6d}
.cover{width:100%;aspect-ratio:16/10;border-radius:14px;overflow:hidden;background:#f0eef4;border:1px solid #ecebf0;display:flex;align-items:center;justify-content:center}
.cover img{width:100%;height:100%;object-fit:cover}

/* products */
.prod{border:1px solid #ecebf0;border-radius:14px;padding:14px;margin-bottom:10px;background:#faf9fb}
.prod .ph{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.prod .ph .inp{background:#fff}
.optrow{display:flex;gap:8px;align-items:center;margin-top:8px}
.optrow .inp{background:#fff;padding:10px 12px;font-size:13.5px}
.xbtn{width:38px;height:38px;flex:none;border:1px solid #e6e3ec;background:#fff;border-radius:10px;color:#8d8697;font-size:16px}
.xbtn:hover{border-color:#ffb3c1;color:#ff4d6d}

/* tiers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tier{border:1.5px solid #e6e3ec;border-radius:16px;padding:16px;background:#faf9fb;text-align:left}
.tier.on{border-color:#ff4d6d;background:#fff5f7}
.tier b{display:block;font-size:15px;font-weight:800;margin-bottom:4px}
.tier em{display:block;font-style:normal;font-size:19px;font-weight:800;color:#ff4d6d;margin-bottom:9px}
.tier ul{margin:0;padding-left:16px;font-size:12px;color:#6b6475;line-height:1.85;font-weight:600}

/* landing */
.hero{background:linear-gradient(#fff,#fdf7f8);border:1px solid #f0e6ea;border-radius:22px;padding:clamp(24px,4vw,44px);text-align:center}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:22px}
.kpi{background:#fff;border:1px solid #ecebf0;border-radius:14px;padding:16px 12px}
.kpi b{display:block;font-size:22px;font-weight:800;color:#ff4d6d}
.kpi span{display:block;font-size:12px;color:#8d8697;font-weight:700;margin-top:4px}
.flow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:6px}
.fstep{background:#faf9fb;border:1px solid #ecebf0;border-radius:14px;padding:16px 14px}
.fstep i{display:block;font-style:normal;width:26px;height:26px;border-radius:8px;background:#2b2530;color:#fff;font-size:12.5px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.fstep b{display:block;font-size:14px;font-weight:800;margin-bottom:4px}
.fstep span{font-size:12px;color:#8d8697;font-weight:600;line-height:1.65}
.ftable{width:100%;border-collapse:collapse;font-size:13.5px}
.ftable th,.ftable td{text-align:left;padding:12px 10px;border-bottom:1px solid #f0eef4}
.ftable th{font-size:12px;color:#8d8697;font-weight:800}
.ftable td b{font-weight:800}

/* kakao */
.kakao{width:100%;border:none;border-radius:13px;padding:15px 0;font-size:15px;font-weight:800;background:#FEE500;color:#191600;display:flex;align-items:center;justify-content:center;gap:8px}
.kakao:hover{background:#f5dc00}
.divider{display:flex;align-items:center;gap:10px;margin:16px 0;color:#b6aebd;font-size:12px;font-weight:700}
.divider:before,.divider:after{content:'';flex:1;height:1px;background:#ecebf0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:9000;background:#2b2530;color:#fff;border-radius:999px;padding:13px 22px;font-size:13.5px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-6px)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.muted{color:#a49dae;font-size:12.5px;font-weight:600}
.hide{display:none!important}

@media(max-width:820px){
  .flow,.tiers{grid-template-columns:1fr 1fr}
  .row.c3{grid-template-columns:1fr 1fr}
}
@media(max-width:640px){
  input,select,textarea{font-size:16px!important}
  .brand small{display:none}
  .row.c2,.row.c3{grid-template-columns:1fr}
  .flow,.tiers,.kpis{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(3,1fr)}
  .btnrow{flex-direction:column}
  .hbtn{padding:9px 11px;font-size:12.5px}
  .wrap{padding-bottom:calc(60px + var(--sab))}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <a class="brand" href="index.html"><i><img src="./icon.jpg" alt="웨딩여기"></i>
      <span><b>웨딩여기</b><small>업체 파트너 센터</small></span></a>
    <div class="hsp" id="hsp">
      <a class="hbtn" href="index.html">이용자 사이트</a>
    </div>
  </div>
</header>

<div class="wrap" id="root">
  <div class="card"><p class="sub">불러오는 중…</p></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import * as DB from './db.js';

const CATS = {
  hall:  {name:'웨딩홀',   icon:'💒'},
  studio:{name:'스튜디오', icon:'📷'},
  dress: {name:'드레스',   icon:'👰'},
  makeup:{name:'메이크업', icon:'💄'},
  hanbok:{name:'한복',     icon:'🎎'},
  suit:    {name:'예복',     icon:'🤵'},
  jewelry: {name:'예물',     icon:'💍'},
  honeymoon:{name:'신혼여행', icon:'✈️'}
};
const REGIONS = {
  '부산':['해운대구','수영구','남구','동래구','부산진구','연제구','금정구','사하구','사상구','북구','강서구','기장군','중구','서구','동구','영도구'],
  '경남':['창원시','김해시','양산시','진주시','거제시','통영시','밀양시','사천시','함안군','창녕군','거창군','남해군','하동군','고성군','의령군','산청군','합천군']
};
const HALLTYPES = ['호텔','컨벤션','하우스','채플','야외','한옥','스몰웨딩'];
const DAYS = [['mon','월'],['tue','화'],['wed','수'],['thu','목'],['fri','금'],['sat','토'],['sun','일']];
const TIERS = [
  {id:'basic',   name:'베이직',   price:'무료',        feats:['기본 노출','상담 신청 수신','업체 정보·사진 관리']},
  {id:'plus',    name:'플러스',   price:'월 9.9만원',  feats:['카테고리 상단 노출','검색 우선순위 가중','추천 카드 후보 등록','상담 알림 우선 배정']},
  {id:'premium', name:'프리미엄', price:'월 29만원',   feats:['홈 메인 배너 노출','지도 핀 강조 표시','랭킹·기획전 우선 편성','전담 매니저 배정']}
];

const $ = s => document.querySelector(s);
const root = $('#root');
const el = (t,a={},kids=[]) => {
  const n = document.createElement(t);
  for(const k in a){
    if(k==='class') n.className=a[k];
    else if(k==='html') n.innerHTML=a[k];
    else if(k.startsWith('on')) n[k]=a[k];
    else if(a[k]!=null && a[k]!==false) n.setAttribute(k,a[k]);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(c=>{ if(c==null||c===false) return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;
};
let _t;
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(_t); _t=setTimeout(()=>t.classList.remove('on'),2600); }
const won = n => (n|0).toLocaleString('ko-KR');
const dt = s => s? new Date(s).toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'}) : '-';
function friendly(e){
  const m = (e && (e.message||e.error_description||String(e))) || '';
  if(/does not exist|schema cache|relation/i.test(m)) return 'DB 테이블이 아직 없습니다. Supabase > SQL Editor 에서 supabase-schema.sql 을 실행해 주세요.';
  if(/Invalid login/i.test(m)) return '이메일 또는 비밀번호가 올바르지 않습니다.';
  if(/already registered|User already/i.test(m)) return '이미 가입된 이메일입니다. 로그인해 주세요.';
  if(/Password should be/i.test(m)) return '비밀번호는 6자 이상이어야 합니다.';
  if(/rate limit/i.test(m)) return '요청이 많습니다. 잠시 후 다시 시도해 주세요.';
  if(/Bucket not found/i.test(m)) return '이미지 저장소가 없습니다. supabase-schema.sql 을 실행해 주세요.';
  if(/row-level security|policy/i.test(m)) return '권한이 없습니다. 다시 로그인해 주세요.';
  if(/fetch|network|Failed/i.test(m)) return '네트워크 연결을 확인해 주세요.';
  return m || '문제가 발생했어요.';
}

const S = {
  user:null, profile:null, page:'landing',
  vendors:[], v:null, images:[], products:[], step:1,
  billings:[], billingsLoaded:false,
  busy:false, err:'', authMode:'signup', form:{}
};

/* ══════════════ 부트 ══════════════ */
(async function boot(){
  if(!DB.ready()){ root.innerHTML = '<div class="card"><div class="err">Supabase에 연결할 수 없습니다. 잠시 후 새로고침해 주세요.</div></div>'; return; }
  S.user = await DB.currentUser();
  if(S.user){
    S.profile = await DB.ensureProfile(S.user);
    S.vendors = await DB.myVendors(S.user.id);
    S.page = 'mine';
  }
  render();
})();

async function refreshVendors(){ S.vendors = await DB.myVendors(S.user.id); }

/* ══════════════ 렌더 ══════════════ */
function render(){
  renderHeader();
  root.innerHTML = '';
  if(!S.user){ root.appendChild(landing()); return; }
  if(S.page==='mine')    { root.appendChild(mine()); return; }
  if(S.page==='billing') { root.appendChild(billing()); return; }
  if(S.page==='form')    { root.appendChild(form()); return; }
  if(S.page==='done')    { root.appendChild(done()); return; }
  root.appendChild(mine());
}

function renderHeader(){
  const h = $('#hsp'); h.innerHTML='';
  h.appendChild(el('a',{class:'hbtn',href:'index.html'},'이용자 사이트'));
  if(S.user){
    if(S.page!=='mine') h.appendChild(el('button',{class:'hbtn',onclick:()=>{ S.page='mine'; S.err=''; render(); }},'내 업체'));
    if(S.page!=='billing') h.appendChild(el('button',{class:'hbtn',onclick:()=>{ S.page='billing'; S.err=''; render(); loadBillings(); }},'정산 내역'));
    h.appendChild(el('a',{class:'hbtn',href:'ad-center.html'},'광고센터'));
    h.appendChild(el('button',{class:'hbtn',onclick:logout},'로그아웃'));
  }
}

async function logout(){ await DB.signOut(); S.user=null; S.profile=null; S.vendors=[]; S.page='landing'; render(); }

/* ══════════════ 랜딩 (미로그인) ══════════════ */
function landing(){
  const box = el('div');

  box.appendChild(el('div',{class:'hero'},[
    el('h1',{class:'pt'},'부산·경남 예비부부가 찾는 곳에, 우리 업체를 올리세요'),
    el('p',{class:'sub'},'지도 기반 검색 · 예식일과 하객수로 걸러지는 추천 · 스드메 묶음 비교. 조건이 맞는 고객만 상담으로 연결됩니다.'),
    el('div',{class:'kpis'},[
      el('div',{class:'kpi'},[el('b',{},'무료~29만원'),el('span',{},'베이직~프리미엄 요금제')]),
      el('div',{class:'kpi'},[el('b',{},'무료'),el('span',{},'베이직 입점료')]),
      el('div',{class:'kpi'},[el('b',{},'2~3일'),el('span',{},'승인 소요')])
    ])
  ]));

  box.appendChild(el('div',{class:'card'},[
    el('h2',{class:'sec'},'입점 절차'),
    el('p',{class:'seclead'},'승인 후 이용자 사이트·지도에 바로 노출됩니다.'),
    el('div',{class:'flow'},[
      ['1','파트너 가입','카카오 또는 이메일로 1분'],
      ['2','업체 정보 입력','사업자·사진·가격표 5단계'],
      ['3','관리자 승인','서류·정보 확인 후 2~3일'],

async function doAuth(){
  const f=S.form, su=S.authMode==='signup';
  S.err='';
  if(!f.email || !f.pw){ S.err='이메일과 비밀번호를 입력해 주세요.'; return render(); }
  if(su && (!f.name || !f.phone)){ S.err='담당자 이름과 연락처를 입력해 주세요.'; return render(); }
  S.busy=true; render();
  try{
    if(su){
      await DB.signUp({email:f.email,password:f.pw,name:f.name,phone:f.phone,isTbd:true,role:'vendor',marketing:f.marketing});
      S.user = await DB.currentUser();
      if(!S.user){ S.busy=false; S.err='가입 확인 메일을 확인한 뒤 로그인해 주세요.'; S.authMode='login'; return render(); }
    } else {
      S.user = await DB.signIn({email:f.email,password:f.pw});
    }
    S.profile = await DB.ensureProfile(S.user);
    if(S.profile && S.profile.role!=='vendor' && S.profile.role!=='admin'){ await DB.setRole(S.user.id,'vendor'); }
    await refreshVendors();
    S.busy=false; S.form={}; S.page='mine'; render();
  }catch(e){ S.busy=false; S.err=friendly(e); render(); }
}

async function geocode(){
  const q = [S.v.address, S.v.address_detail].filter(Boolean).join(' ');
  if(!q){ S.err='먼저 주소를 입력해 주세요.'; return render(); }
  S.busy=true; S.err=''; render();
  try{
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent(q));
    const j = await r.json();
    if(j && j[0]){ set('lat', (+j[0].lat).toFixed(6)); set('lng', (+j[0].lon).toFixed(6)); toast('좌표를 찾았습니다'); }
    else S.err='좌표를 찾지 못했습니다. 직접 입력해 주세요.';
  }catch(e){ S.err='좌표 조회에 실패했습니다. 직접 입력해 주세요.'; }
  S.busy=false; render();
}

/* --- step 3: 사진 --- */
function step3(){
  const needSave = !S.v.id;
  return el('div',{},[
    el('div',{class:'field'},[
      el('label',{},['대표 사진',el('span',{class:'req'},'*')]),
      el('div',{class:'cover'}, S.v.cover_url? el('img',{src:S.v.cover_url,alt:''}) : el('span',{class:'muted'},'16:10 비율 권장')),
      el('label',{class:'btn ghost',style:'display:inline-flex;margin-top:10px'},[
        S.v.cover_url? '대표 사진 변경':'대표 사진 올리기',
        el('input',{type:'file',accept:'image/*',style:'display:none',onchange:async e=>{
          const f=e.target.files[0]; if(!f) return;
          S.busy=true; render();
          try{ set('cover_url', await DB.uploadMedia(f,'cover')); }catch(err){ S.err=friendly(err); }
          S.busy=false; render();
        }})
      ])
    ]),
    el('div',{class:'field'},[
      el('label',{},'갤러리 ('+S.images.length+'/20)'),
      needSave? el('div',{class:'hint',style:'margin-bottom:10px'},'먼저 [임시저장]을 눌러 업체를 만들면 갤러리를 올릴 수 있어요.'):null,
      el('div',{class:'gal'}, S.images.map(im=>el('div',{class:'gcell'},[
        el('img',{src:im.url,alt:im.caption||''}),
        el('button',{onclick:async()=>{ await DB.removeVendorImage(im.id); S.images=S.images.filter(x=>x.id!==im.id); render(); }},'×')
      ])).concat( (!needSave && S.images.length<20) ? [
        el('label',{class:'drop'},[
          el('span',{style:'font-size:20px'},'＋'), el('span',{},'사진 추가'),
          el('input',{type:'file',accept:'image/*',multiple:true,style:'display:none',onchange:async e=>{
            const files=[...e.target.files].slice(0,20-S.images.length); if(!files.length) return;
            S.busy=true; render();
            for(const f of files){
              try{ const url=await DB.uploadMedia(f,'gallery');
                   const row=await DB.addVendorImage(S.v.id,url,S.images.length); if(row) S.images.push(row); }
              catch(err){ S.err=friendly(err); break; }
            }
            S.busy=false; render();
          }})
        ])
      ] : []))
    ])
  ]);
}

/* --- step 4: 가격표 --- */
function step4(){
  const isHall = S.v.cat==='hall';
  const box = el('div');

  if(isHall){
    box.appendChild(el('div',{class:'row c3'},[
      tf('guarantee','보증 인원','200',{num:true,inputmode:'numeric',hint:'명'}),
      tf('meal_price','1인 식대','55000',{num:true,inputmode:'numeric',hint:'원'}),
      tf('hall_count','홀 개수','2',{num:true,inputmode:'numeric'})
    ]));
    box.appendChild(el('div',{class:'field'},[
      el('label',{},'홀 타입'),
      el('div',{class:'pillrow'}, HALLTYPES.map(t=>{
        const on = S.v.hall_types.includes(t);
        return el('button',{class:'pill'+(on?' on':''),onclick:()=>{
          S.v.hall_types = on? S.v.hall_types.filter(x=>x!==t) : [...S.v.hall_types,t]; render();
        }},t);
      }))
    ]));
    box.appendChild(tf('parking','주차','200대 무료 (2시간)'));
  }

  box.appendChild(tf('price_from', isHall?'대관 시작가':'상품 시작가', '1500000', {num:true,req:true,inputmode:'numeric',hint:'목록과 지도 핀에 "○○만원~"으로 표시됩니다.'}));

  box.appendChild(el('div',{class:'field'},[
    el('label',{},'상품 · 패키지'),
    el('div',{}, S.products.map((p,i)=>productRow(p,i))),
    el('button',{class:'btn ghost',onclick:()=>{ S.products.push({name:'',price:0,options:[],includes:'',_new:true}); render(); }},'+ 상품 추가'),
    el('div',{class:'hint'},'예: 베이직 / 스탠다드 / 프리미엄, 또는 홀별 대관료')
  ]));
  return box;
}

function productRow(p,i){
  const upd = (k,val)=>{ p[k]=val; };
  return el('div',{class:'prod'},[
    el('div',{class:'ph'},[
      el('input',{class:'inp',placeholder:'상품명 (예: 스탠다드)',value:p.name||'',oninput:e=>upd('name',e.target.value)}),
      el('input',{class:'inp',style:'max-width:150px',placeholder:'금액',inputmode:'numeric',value:p.price||'',
        oninput:e=>upd('price', e.target.value.replace(/[^0-9]/g,'')|0)}),
      el('button',{class:'xbtn',title:'삭제',onclick:async()=>{
        if(p.id) await DB.removeVendorProduct(p.id);
        S.products.splice(i,1); render();
      }},'×')
    ]),
    el('input',{class:'inp',style:'background:#fff;padding:11px 13px;font-size:13.5px',placeholder:'포함사항 (예: 원본 전체 + 수정 15장 + 액자)',
      value:p.includes||'',oninput:e=>upd('includes',e.target.value)}),
    el('div',{style:'margin-top:10px'},[
      el('div',{class:'muted',style:'margin-bottom:6px'},'추가 옵션'),
      ...(p.options||[]).map((o,oi)=>el('div',{class:'optrow'},[
        el('input',{class:'inp',placeholder:'옵션명',value:o.name||'',oninput:e=>{ o.name=e.target.value; }}),
        el('input',{class:'inp',style:'max-width:120px',placeholder:'금액',inputmode:'numeric',value:o.price||'',
          oninput:e=>{ o.price=e.target.value.replace(/[^0-9]/g,'')|0; }}),
        el('button',{class:'xbtn',onclick:()=>{ p.options.splice(oi,1); render(); }},'×')
      ])),
      el('button',{class:'hbtn',style:'margin-top:8px',onclick:()=>{ p.options=p.options||[]; p.options.push({name:'',price:0}); render(); }},'+ 옵션')
    ])
  ]);
}

/* --- step 5: 소개·운영 --- */
function step5(){
  const oh = S.v.open_hours||{};
  return el('div',{},[
    tf('intro','한 줄 소개','예: 오션뷰 채플과 300석 컨벤션을 함께 운영합니다',{req:true,hint:'목록 카드에 노출됩니다. 40자 이내 권장'}),
    tf('detail','상세 설명','시설, 특징, 포함사항, 예약 안내 등을 자유롭게 적어주세요',{area:true,rows:7}),
    el('div',{class:'field'},[
      el('label',{},'영업시간'),
      el('div',{style:'display:grid;gap:8px'}, DAYS.map(([k,ko])=>{
        const d = oh[k]||{};
        const closed = (S.v.closed_days||[]).includes(k);
        return el('div',{style:'display:flex;align-items:center;gap:9px'},[
          el('span',{style:'width:26px;font-size:13px;font-weight:800;color:#4a4550;flex:none'},ko),
          el('input',{class:'inp',style:'padding:9px 11px;font-size:14px',type:'time',value:d.o||'',disabled:closed,
            oninput:e=>{ oh[k]={...(oh[k]||{}),o:e.target.value}; set('open_hours',oh); }}),
          el('span',{class:'muted'},'~'),
          el('input',{class:'inp',style:'padding:9px 11px;font-size:14px',type:'time',value:d.c||'',disabled:closed,
            oninput:e=>{ oh[k]={...(oh[k]||{}),c:e.target.value}; set('open_hours',oh); }}),
          el('button',{class:'pill'+(closed?' on':''),style:'flex:none',onclick:()=>{
            const cd = S.v.closed_days||[];
            set('closed_days', closed? cd.filter(x=>x!==k) : [...cd,k]); render();
          }},'휴무')
        ]);
      }))
    ]),
    tf('holiday_memo','휴무 안내','예: 매월 첫째 주 월요일 휴무'),
    el('div',{class:'field'},[
      el('label',{},'노출 등급'),
      el('div',{class:'tiers'}, TIERS.map(t=>el('button',{class:'tier'+(S.v.tier===t.id?' on':''),onclick:()=>{ set('tier',t.id); render(); }},[
        el('b',{},t.name), el('em',{},t.price),
        el('ul',{}, t.feats.slice(0,3).map(f=>el('li',{},f)))
      ]))),
      el('div',{class:'hint'},'유료 등급은 승인 후 담당자가 연락해 계약을 진행합니다. 계약 전에는 베이직으로 노출됩니다.')
    ])
  ]);
}

/* --- 저장 / 제출 --- */
function validate(step){
  const v=S.v;
  if(step>=1){
    if(!v.biz_no || !v.biz_owner) return '사업자등록번호와 대표자명을 입력해 주세요.';
    if(!v.biz_file_url) return '사업자등록증 사본을 첨부해 주세요.';
  }
  if(step>=2){
    if(!v.name) return '상호를 입력해 주세요.';
    if(!v.sigungu) return '시·군·구를 선택해 주세요.';
    if(!v.address) return '주소를 입력해 주세요.';
    if(!v.tel) return '대표 전화를 입력해 주세요.';
    if(!v.lat || !v.lng) return '지도 표시를 위해 좌표가 필요합니다. [주소로 좌표 찾기]를 눌러주세요.';
  }
  if(step>=3 && !v.cover_url) return '대표 사진을 올려주세요.';
  if(step>=4 && !v.price_from) return '시작가를 입력해 주세요.';
  if(step>=5 && !v.intro) return '한 줄 소개를 입력해 주세요.';
  return '';
}

function payload(){
  const v=S.v;
  return {
    biz_no:v.biz_no||null, biz_owner:v.biz_owner||null, biz_file_url:v.biz_file_url||null,
    name:v.name||'(작성 중)', cat:v.cat||'hall', region:v.region||null, sigungu:v.sigungu||null,
    address:v.address||null, address_detail:v.address_detail||null,
    lat:v.lat? +v.lat : null, lng:v.lng? +v.lng : null,
    tel:v.tel||null, kakao_url:v.kakao_url||null, insta_url:v.insta_url||null, homepage:v.homepage||null,
    manager_name:v.manager_name||null, manager_phone:v.manager_phone||null,
    cover_url:v.cover_url||null, intro:v.intro||null, detail:v.detail||null,
    price_from:v.price_from|0,
    open_hours:v.open_hours||{}, closed_days:v.closed_days||[], holiday_memo:v.holiday_memo||null,
    guarantee:v.guarantee? v.guarantee|0 : null, hall_types:v.hall_types||[],
    meal_price:v.meal_price? v.meal_price|0 : null, hall_count:v.hall_count? v.hall_count|0 : null,
    parking:v.parking||null, tier:v.tier||'basic'
  };
}

async function persist(){
  if(S.v.id){ const r = await DB.updateVendor(S.v.id, payload()); if(r) S.v={...S.v,...r}; }
  else { const r = await DB.createVendor(S.user.id, payload()); if(r) S.v={...S.v,...r}; }
  for(const p of S.products){
    if(!p.name) continue;
    const saved = await DB.saveVendorProduct(S.v.id, p);
    if(saved){ p.id=saved.id; delete p._new; }
  }
  await refreshVendors();
}

async function save(advance){
  S.err=''; S.busy=true; render();
  try{
    if(advance){ const m=validate(S.step); if(m){ S.busy=false; S.err=m; return render(); } }
    await persist();
    S.busy=false;
    if(advance && S.step<5) S.step++;
    else if(!advance) toast('저장했습니다');
    render();
  }catch(e){ S.busy=false; S.err=friendly(e); render(); }
}

async function submitForReview(){
  S.err='';
  for(let i=1;i<=5;i++){ const m=validate(i); if(m){ S.step=i; S.err=m; return render(); } }
  S.busy=true; render();
  try{
    await persist();
    if(S.v.status!=='approved') await DB.submitVendor(S.v.id);
    await refreshVendors();
    S.busy=false;
    if(S.v.status==='approved'){ S.page='mine'; toast('수정 내용을 저장했습니다'); }
    else S.page='done';
    render();
  }catch(e){ S.busy=false; S.err=friendly(e); render(); }
}

function done(){
  return el('div',{class:'card',style:'text-align:center;padding:52px 24px'},[
    el('div',{style:'font-size:46px;margin-bottom:12px'},'📮'),
    el('h1',{class:'pt'},'승인 검토를 요청했습니다'),
    el('p',{class:'sub'},'사업자 정보와 등록 내용을 확인한 뒤 2~3일 내 결과를 알려드립니다.<br>승인되면 지도·목록·추천에 바로 노출됩니다.'),
    el('div',{class:'btnrow',style:'max-width:340px;margin:26px auto 0'},[
      el('button',{class:'btn',onclick:()=>{ S.page='mine'; render(); }},'내 업체 목록')
    ])
  ]);
}
</script>
</body>
