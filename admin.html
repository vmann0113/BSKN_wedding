<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운영 관리자 · 웨딩여기</title>
<link rel="icon" type="image/jpeg" href="./icon.jpg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
@font-face{font-family:'Paperlogy';font-weight:400;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:600;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2')}
@font-face{font-family:'Paperlogy';font-weight:800;font-display:swap;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2')}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0}
body{font-family:'Paperlogy','Pretendard',system-ui,sans-serif;background:#f4f3f6;color:#2b2530;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
a{color:#ff4d6d;text-decoration:none}
a:hover{color:#e03e5c}
button,a{-webkit-tap-highlight-color:rgba(255,77,109,.12);touch-action:manipulation}

header{position:sticky;top:0;z-index:80;background:#2b2530;color:#fff}
.hrow{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:11px clamp(14px,3vw,26px);min-width:0}
.brand{display:flex;align-items:center;gap:9px;color:#fff;min-width:0}
.brand i{width:30px;height:30px;border-radius:9px;overflow:hidden;flex:none;display:block}
.brand i img{width:100%;height:100%;object-fit:cover;display:block}
.brand b{font-size:15.5px;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:10.5px;color:#a49dae;font-weight:700}
.hsp{margin-left:auto;display:flex;gap:8px;flex:none}
.hbtn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:700;color:#fff}
.hbtn:hover{background:rgba(255,255,255,.18)}

nav.tabs{background:#fff;border-bottom:1px solid #ecebf0;position:sticky;top:52px;z-index:70}
nav.tabs div{max-width:1240px;margin:0 auto;display:flex;gap:2px;padding:0 clamp(10px,3vw,26px);overflow-x:auto;scrollbar-width:none}
nav.tabs div::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:none;border-bottom:2.5px solid transparent;padding:14px 13px;font-size:13.5px;font-weight:700;color:#8d8697;white-space:nowrap;flex:none}
nav.tabs button.on{color:#2b2530;border-bottom-color:#ff4d6d;font-weight:800}
nav.tabs button b{background:#ff4d6d;color:#fff;border-radius:99px;font-size:10.5px;padding:1px 6px;margin-left:5px;vertical-align:1px}

.wrap{max-width:1240px;margin:0 auto;padding:clamp(16px,2.6vw,26px) clamp(14px,3vw,26px) 70px}
.card{background:#fff;border:1px solid #ecebf0;border-radius:16px;padding:clamp(16px,2.2vw,22px)}
.card+.card{margin-top:14px}
h2.sec{font-size:16px;font-weight:800;margin:0 0 3px}
.seclead{font-size:12.5px;color:#8d8697;margin:0 0 16px;font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:#fff;border:1px solid #ecebf0;border-radius:14px;padding:16px}
.kpi span{display:block;font-size:11.5px;color:#8d8697;font-weight:800;margin-bottom:6px}
.kpi b{display:block;font-size:25px;font-weight:800;line-height:1}
.kpi em{display:block;font-style:normal;font-size:11.5px;color:#a49dae;font-weight:700;margin-top:6px}
.kpi.hot b{color:#ff4d6d}

table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:11px 9px;border-bottom:1px solid #f0eef4;vertical-align:middle}
th{font-size:11.5px;color:#8d8697;font-weight:800;white-space:nowrap}
td b{font-weight:800}
tbody tr:hover{background:#faf9fb}
.tbwrap{overflow-x:auto;margin:0 -4px}
.tbwrap table{min-width:660px}

.badge{display:inline-flex;align-items:center;border-radius:999px;padding:3px 9px;font-size:11px;font-weight:800;white-space:nowrap}
.b-draft{background:#f2f0f5;color:#7d7589}
.b-pending{background:#fff5e6;color:#a86a00}
.b-approved{background:#eefaf3;color:#1c7a4a}
.b-rejected{background:#fff1f3;color:#c3283f}
.b-suspended{background:#eceaf1;color:#5d5668}
.b-new{background:#fff1f3;color:#c3283f}
.b-doing{background:#eef3ff;color:#2451b8}
.b-done{background:#eefaf3;color:#1c7a4a}

.btn{border:none;border-radius:10px;padding:9px 14px;font-size:12.5px;font-weight:800;background:#ff4d6d;color:#fff}
.btn:hover{background:#f03b5c}
.btn.ghost{background:#f4f3f6;color:#2b2530}
.btn.ghost:hover{background:#ebe9ef}
.btn.line{background:#fff;border:1px solid #e6e3ec;color:#2b2530}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:9px}
.btn:disabled{background:#f2f0f5;color:#b6aebd;cursor:not-allowed}
.filters{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{background:#faf9fb;border:1px solid #e6e3ec;border-radius:999px;padding:8px 14px;font-size:12.5px;font-weight:700;color:#4a4550}
.chip.on{background:#2b2530;border-color:#2b2530;color:#fff}
.inp{width:100%;background:#faf9fb;border:1px solid #e6e3ec;border-radius:10px;padding:11px 12px;font-size:14px;color:#2b2530;outline:none}
.inp:focus{border-color:#ff4d6d;background:#fff}
.err{background:#fff1f3;border:1px solid #ffd3da;color:#c3283f;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:700;margin-bottom:14px;line-height:1.6}
.empty{text-align:center;padding:38px 16px;color:#a49dae;font-size:13.5px;font-weight:700}
.muted{color:#a49dae;font-size:12px;font-weight:600}
.sw{position:relative;width:44px;height:26px;border-radius:99px;background:#dcd8e4;border:none;flex:none;transition:background .18s}
.sw.on{background:#ff4d6d}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .18s}
.sw.on:after{transform:translateX(18px)}
.adrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #f0eef4}
.adrow:last-child{border-bottom:none}
.adrow div{flex:1;min-width:0}
.adrow b{display:block;font-size:14px;font-weight:800}
.mask{position:fixed;inset:0;background:rgba(28,20,36,.5);z-index:900;display:none;align-items:center;justify-content:center;padding:16px}
.mask.open{display:flex}
.modal{width:100%;max-width:440px;background:#fff;border-radius:18px;padding:22px;max-height:calc(100dvh - 32px);overflow-y:auto}
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:800;color:#4a4550;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:9000;background:#2b2530;color:#fff;border-radius:999px;padding:12px 20px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.gate{max-width:400px;margin:60px auto;text-align:center}

@media(max-width:640px){
  input,select,textarea{font-size:16px!important}
  .brand small{display:none}
  nav.tabs{top:50px}
  .kpi b{font-size:21px}
}
</style>
</head>
<body>

<header>
  <div class="hrow">
    <a class="brand" href="index.html"><i><img src="./icon.jpg" alt=""></i>
      <span><b>웨딩여기</b><small>운영 관리자</small></span></a>
    <div class="hsp" id="hsp"></div>
  </div>
</header>
<nav class="tabs" id="tabs"><div></div></nav>

<div class="wrap" id="root"><div class="card"><p class="muted">불러오는 중…</p></div></div>

<div class="mask" id="mask"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script type="module">
import * as DB from './db.js';

const CATS={hall:'웨딩홀',studio:'스튜디오',dress:'드레스',makeup:'메이크업',hanbok:'한복',suit:'예복',jewelry:'예물',honeymoon:'신혼여행'};
const VSTATUS={draft:['작성 중','b-draft'],pending:['승인 대기','b-pending'],approved:['노출 중','b-approved'],rejected:['반려','b-rejected'],suspended:['중지','b-suspended']};
const CSTATUS={'접수완료':['접수완료','b-new'],'상담중':['상담중','b-doing'],'연결완료':['연결완료','b-done'],'종료':['종료','b-draft']};
const TIER_BADGE={basic:'b-draft',plus:'b-pending',premium:'b-approved'};
const AD_STATUS={pending:['광고센터 승인대기','b-pending'],approved:['승인됨','b-approved'],rejected:['반려됨','b-rejected']};
const AD_UNITS=[
  ['hero','홈 히어로 배너'],['strip','카테고리 하단 스트립'],['brand','브랜드 블록'],
  ['infeed','피드 인피드'],['sponsor','스폰서 랭킹'],['sticky','하단 스티키(PC)'],['popup','첫 방문 팝업']
];
const AD_RATE={infeed:{kind:'cpm',amount:8000},sponsor:{kind:'cpc',amount:900}};
const adCost=s=>{ const r=AD_RATE[s.unit]; if(!r) return null; return r.kind==='cpm'? Math.round((s.impressions||0)/1000*r.amount) : (s.clicks||0)*r.amount; };
const TABS=[['dash','대시보드'],['vendors','업체 승인'],['consults','상담'],['orders','예약'],['ads','광고'],['members','회원'],['billing','정산']];

const $=s=>document.querySelector(s);
const el=(t,a={},k=[])=>{const n=document.createElement(t);
  for(const p in a){ if(p==='class')n.className=a[p]; else if(p==='html')n.innerHTML=a[p]; else if(p.startsWith('on'))n[p]=a[p]; else if(a[p]!=null&&a[p]!==false)n.setAttribute(p,a[p]); }
  (Array.isArray(k)?k:[k]).forEach(c=>{ if(c==null||c===false)return; n.appendChild(typeof c==='string'?document.createTextNode(c):c); });
  return n;};
let _t; const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(_t);_t=setTimeout(()=>t.classList.remove('on'),2400);};
const won=n=>(n|0).toLocaleString('ko-KR');
const dt=s=>s? new Date(s).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}) : '-';
const day=s=>s? new Date(s).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'}) : '-';
const friendly=e=>{const m=(e&&(e.message||String(e)))||'';
  if(/does not exist|schema cache|relation/i.test(m))return 'DB 테이블이 없습니다. supabase-schema.sql 을 실행해 주세요.';
  if(/row-level security|policy/i.test(m))return '권한이 없습니다. admins 테이블에 계정이 등록되어 있는지 확인해 주세요.';
  return m||'문제가 발생했어요.';};

const S={user:null,admin:false,tab:'dash',err:'',busy:false,
  stats:null,vendors:[],vFilter:'pending',consults:[],cFilter:'접수완료',orders:[],members:[],ads:{},slots:[],billings:[],login:{}};

(async function boot(){
  if(!DB.ready()){ $('#root').innerHTML='<div class="card"><div class="err">Supabase에 연결할 수 없습니다.</div></div>'; return; }
  S.user=await DB.currentUser();
  if(S.user) S.admin=await DB.isAdmin();
  if(S.admin) await loadTab('dash');
  render();
})();

/* ══════════ 렌더 ══════════ */
function render(){
  const h=$('#hsp'); h.innerHTML='';
  h.appendChild(el('a',{class:'hbtn',href:'index.html'},'사이트'));
  h.appendChild(el('a',{class:'hbtn',href:'vendor.html'},'파트너센터'));
  if(S.user) h.appendChild(el('button',{class:'hbtn',onclick:async()=>{await DB.signOut();location.reload();}},'로그아웃'));

  const tb=$('#tabs').firstElementChild; tb.innerHTML='';
  if(S.admin) TABS.forEach(([id,label])=>{
    const n = id==='vendors'? S.vendors.filter(v=>v.status==='pending').length
            : id==='consults'? S.consults.filter(c=>c.status==='접수완료').length : 0;
    tb.appendChild(el('button',{class:S.tab===id?'on':'',onclick:()=>go(id)},
      [label, n? el('b',{},String(n)) : null].filter(Boolean)));
  });

  const r=$('#root'); r.innerHTML='';
  if(!S.user || !S.admin){ r.appendChild(gate()); return; }
  if(S.err) r.appendChild(el('div',{class:'err'},S.err));
  r.appendChild(({dash,vendors,consults,orders,ads,members,billing})[S.tab]());
}

function gate(){
  const f=S.login;
  return el('div',{class:'card gate'},[
    el('div',{style:'font-size:38px;margin-bottom:10px'},'🔐'),
    el('h2',{class:'sec'}, S.user? '관리자 권한이 없습니다' : '관리자 로그인'),
    el('p',{class:'seclead'}, S.user
      ? '이 계정은 관리자로 등록되지 않았습니다. Supabase > admins 테이블에 user_id 를 추가해 주세요.'
      : '운영 계정으로 로그인해 주세요.'),
    S.err? el('div',{class:'err'},S.err):null,
    S.user? el('div',{class:'muted',style:'line-height:1.8'},[
      el('div',{},'현재 계정: '+(S.user.email||S.user.id)),
      el('code',{style:'display:block;background:#faf9fb;border:1px solid #ecebf0;border-radius:8px;padding:10px;margin-top:10px;font-size:11px;text-align:left;word-break:break-all'},
        "insert into admins(user_id) values ('"+S.user.id+"');")
    ]) : el('div',{},[
      el('div',{class:'field'},[el('label',{},'이메일'),
        el('input',{class:'inp',type:'email',value:f.email||'',oninput:e=>f.email=e.target.value})]),
      el('div',{class:'field'},[el('label',{},'비밀번호'),
        el('input',{class:'inp',type:'password',value:f.pw||'',oninput:e=>f.pw=e.target.value})]),
      el('button',{class:'btn',style:'width:100%;padding:13px',disabled:S.busy,onclick:async()=>{
        S.err='';S.busy=true;render();
        try{ S.user=await DB.signIn({email:f.email,password:f.pw}); S.admin=await DB.isAdmin();
             if(S.admin) await loadTab('dash'); }
        catch(e){ S.err=friendly(e); }
        S.busy=false;render();
      }}, S.busy? el('span',{class:'spin'}):'로그인')
    ])
  ]);
}

async function go(tab){ S.tab=tab; S.err=''; S.busy=true; render(); await loadTab(tab); S.busy=false; render(); }

async function loadTab(tab){
  try{
    if(tab==='dash'){ S.stats=await DB.adminStats(); S.vendors=await DB.adminVendors('all'); S.consults=await DB.adminConsults('all'); }
    if(tab==='vendors')  S.vendors=await DB.adminVendors('all');
    if(tab==='consults') S.consults=await DB.adminConsults('all');
    if(tab==='orders')   S.orders=await DB.adminOrders();
    if(tab==='members')  S.members=await DB.adminMembers();
    if(tab==='ads'){ S.ads=await DB.loadAdUnits()||{}; S.slots=await DB.adminAdSlots(); if(!S.vendors.length) S.vendors=await DB.adminVendors('approved'); }
    if(tab==='billing'){ S.billings=await DB.listBillings(); if(!S.vendors.length) S.vendors=await DB.adminVendors('all'); }
  }catch(e){ S.err=friendly(e); }
}

/* ══════════ 대시보드 ══════════ */
function dash(){
  const s=S.stats||{};
  const pending=S.vendors.filter(v=>v.status==='pending');
  const open=S.consults.filter(c=>c.status==='접수완료');
  const box=el('div');

  box.appendChild(el('div',{class:'kpis'},[
    ['회원',won(s.members||0),'최근 7일 +'+won(s.members_7d||0)],
    ['노출 업체',won(s.vendors_live||0),'승인 대기 '+won(s.vendors_pending||0)+'곳'],
    ['미처리 상담',won(s.consults_open||0),'최근 7일 '+won(s.consults_7d||0)+'건'],
    ['예약 건수',won(s.orders_all||0),'결제완료 '+won(s.revenue_paid||0)+'원']
  ].map((k,i)=>el('div',{class:'kpi'+(i===2&&(s.consults_open|0)>0?' hot':'')},[
    el('span',{},k[0]),el('b',{},k[1]),el('em',{},k[2])]))));

  box.appendChild(el('div',{class:'card',style:'margin-top:14px'},[
    el('h2',{class:'sec'},'지금 처리할 일'),
    el('p',{class:'seclead'},'대기 중인 승인과 상담을 먼저 처리하세요.'),
    (!pending.length && !open.length)
      ? el('div',{class:'empty'},'✨ 대기 중인 항목이 없습니다')
      : el('div',{},[
          ...pending.slice(0,5).map(v=>el('div',{class:'adrow'},[
            el('span',{class:'badge b-pending'},'승인 대기'),
            el('div',{},[el('b',{},v.name),el('span',{class:'muted'},(CATS[v.cat]||v.cat)+' · '+(v.sigungu||'-')+' · '+dt(v.submitted_at))]),
            el('button',{class:'btn sm',onclick:()=>go('vendors')},'검토')
          ])),
          ...open.slice(0,5).map(c=>el('div',{class:'adrow'},[
            el('span',{class:'badge b-new'},'상담'),
            el('div',{},[el('b',{},c.name+' · '+c.phone),el('span',{class:'muted'},(c.target||'-')+' · '+dt(c.created_at))]),
            el('button',{class:'btn sm',onclick:()=>go('consults')},'처리')
          ]))
        ])
  ]));
  return box;
}

/* ══════════ 업체 승인 ══════════ */
function vendors(){
  const counts = {};
  S.vendors.forEach(v=>counts[v.status]=(counts[v.status]||0)+1);
  const list = S.vFilter==='all'? S.vendors : S.vendors.filter(v=>v.status===S.vFilter);

  return el('div',{class:'card'},[
    el('div',{style:'display:flex;align-items:flex-start;gap:10px;margin-bottom:2px'},[
      el('div',{style:'flex:1'},[
        el('h2',{class:'sec',style:'margin:0'},'업체 승인 관리'),
        el('p',{class:'seclead',style:'margin:0'},'승인하면 이용자 사이트·지도에 즉시 노출됩니다.')
      ]),
      el('a',{class:'btn sm ghost',href:'vendor-bulk-template.csv',download:'vendor-bulk-template.csv'},'양식 다운로드'),
      el('label',{class:'btn sm',style:'cursor:pointer'},[
        '+ CSV 대량 등록',
        el('input',{type:'file',accept:'.csv',style:'display:none',onchange:e=>{ if(e.target.files[0]) importVendorCSV(e.target.files[0]); e.target.value=''; }})
      ])
    ]),
    el('div',{class:'filters'}, [['pending','승인 대기'],['approved','노출 중'],['rejected','반려'],['draft','작성 중'],['suspended','중지'],['all','전체']]
      .map(([k,label])=>el('button',{class:'chip'+(S.vFilter===k?' on':''),onclick:()=>{S.vFilter=k;render();}},
        label+(k==='all'? ' '+S.vendors.length : ' '+(counts[k]||0))))),
    list.length? el('div',{class:'tbwrap'},el('table',{},[
      el('thead',{},el('tr',{},['업체','카테고리','지역','시작가','등급','신청일','상태',''].map(h=>el('th',{},h)))),
      el('tbody',{}, list.map(v=>{
        const st=VSTATUS[v.status]||VSTATUS.draft;
        return el('tr',{},[
          el('td',{},[el('b',{},v.name||'-'),el('div',{class:'muted'},v.biz_no? '사업자 '+v.biz_no : '사업자번호 없음')]),
          el('td',{},CATS[v.cat]||v.cat),
          el('td',{},(v.region||'')+' '+(v.sigungu||'')),

function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const rows=[]; let row=[]; let cur=''; let inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){ if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else inQ=false; } else cur+=c; }
    else if(c==='"') inQ=true;
    else if(c===','){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else if(c==='\r'){ /* skip */ }
    else cur+=c;
  }
  if(cur.length || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0]===''));
}
const CSV_HEADER_MAP = {
  '업체명':'name','카테고리':'cat','지역':'region','시군구':'sigungu','주소':'address','상세주소':'address_detail',
  '위도':'lat','경도':'lng','전화번호':'tel','한줄소개':'intro','시작가':'price_from','보증인원':'guarantee',
  '홀타입':'hall_types','1인식대':'meal_price','주차안내':'parking','대표이미지URL':'cover_url',
  '카카오채널URL':'kakao_url','인스타그램URL':'insta_url','홈페이지URL':'homepage','사업자등록번호':'biz_no','대표자명':'biz_owner'
};
const CSV_CAT_MAP = {hall:'hall',studio:'studio',dress:'dress',makeup:'makeup',hanbok:'hanbok',suit:'suit',jewelry:'jewelry',honeymoon:'honeymoon',
  '웨딩홀':'hall','스튜디오':'studio','드레스':'dress','메이크업':'makeup','한복':'hanbok','예복':'suit','예물':'jewelry','신혼여행':'honeymoon'};
async function importVendorCSV(file){
  let rows;
  try{ rows = parseCSV(await file.text()); }catch(e){ toast('CSV를 읽을 수 없습니다'); return; }
  if(rows.length<2){ toast('데이터가 없습니다'); return; }
  const header = rows[0].map(h=>CSV_HEADER_MAP[h.trim()]||h.trim());
  const dataRows = rows.slice(1).filter(r=>r.some(c=>(c||'').trim()!==''));
  let existing;
  try{ existing = await DB.existingVendorKeys(); }catch(e){ existing = new Set(); }
  const toInsert=[]; let skipped=0, invalid=0;
  for(const r of dataRows){
    const obj={}; header.forEach((k,i)=>obj[k]=(r[i]||'').trim());
    const cat = CSV_CAT_MAP[(obj.cat||'').toLowerCase()];
    if(!obj.name || !cat){ invalid++; continue; }
    const key = obj.name+'|'+(obj.address||'');
    if(existing.has(key)){ skipped++; continue; }
    toInsert.push({
      name:obj.name, cat, region:obj.region||null, sigungu:obj.sigungu||null,
      address:obj.address||null, address_detail:obj.address_detail||null,
      lat:obj.lat?parseFloat(obj.lat):null, lng:obj.lng?parseFloat(obj.lng):null,
      tel:obj.tel||null, intro:obj.intro||null,
      price_from:obj.price_from?parseInt(String(obj.price_from).replace(/[^0-9]/g,''),10)||0:0,
      guarantee:obj.guarantee?parseInt(obj.guarantee,10)||null:null,
      hall_types: obj.hall_types? obj.hall_types.split(/[\/,·]/).map(s=>s.trim()).filter(Boolean) : [],
      meal_price:obj.meal_price?parseInt(String(obj.meal_price).replace(/[^0-9]/g,''),10)||null:null,
      parking:obj.parking||null, cover_url:obj.cover_url||null,
      kakao_url:obj.kakao_url||null, insta_url:obj.insta_url||null, homepage:obj.homepage||null,
      biz_no:obj.biz_no||null, biz_owner:obj.biz_owner||null,
      status:'approved', tier:'basic', approved_at:new Date().toISOString()
    });
    existing.add(key);
  }
  if(!toInsert.length){ toast('등록할 새 업체가 없습니다 (중복 '+skipped+'건 · 형식오류 '+invalid+'건)'); return; }
  const needGeo = toInsert.filter(v=>(!v.lat||!v.lng) && v.address);
  let geoFound=0;
  for(let i=0;i<needGeo.length;i++){
    const v = needGeo[i];
    toast('주소로 좌표 조회 중… ('+(i+1)+'/'+needGeo.length+')');
    try{
      const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=kr&q='+encodeURIComponent([v.address,v.address_detail].filter(Boolean).join(' ')));
      const j = await r.json();
      if(j && j[0]){ v.lat=+(+j[0].lat).toFixed(6); v.lng=+(+j[0].lon).toFixed(6); geoFound++; }
    }catch(e){ /* leave lat/lng null, admin can fix later */ }
    if(i<needGeo.length-1) await new Promise(res=>setTimeout(res,1100)); // nominatim rate limit
  }
  try{
    const n = await DB.bulkInsertVendors(toInsert);
    toast(n+'곳 등록 완료'+(needGeo.length? ' · 좌표 '+geoFound+'/'+needGeo.length+'건 자동 조회':'')+(skipped?' · 중복 '+skipped+'건 제외':'')+(invalid?' · 형식오류 '+invalid+'건 제외':''));
    S.vendors = await DB.adminVendors('all'); render();
  }catch(e){ S.err=friendly(e); render(); }
}

              catch(e){ S.err=friendly(e); render(); }

        el('tbody',{},S.billings.map(b=>{
          const v=S.vendors.find(x=>x.id===b.vendor_id);
          const KIND={subscription:'입점료',ad:'광고',consult_fee:'상담수수료',booking_fee:'예약수수료'};
          return el('tr',{},[
            el('td',{},el('b',{},v?v.name:'-')),
            el('td',{},KIND[b.kind]||b.kind),
            el('td',{class:'muted'},b.period||'-'),
            el('td',{},el('b',{},won(b.amount)+'원')),
            el('td',{},el('span',{class:'badge '+(b.status==='paid'?'b-approved':b.status==='void'?'b-draft':'b-pending')},
              ({unpaid:'미수',paid:'수납',void:'취소'})[b.status]||b.status)),
            el('td',{class:'muted'},b.memo||'-'),
            el('td',{},b.status==='unpaid'? el('button',{class:'btn sm',onclick:async()=>{
              try{ const r=await DB.saveBilling({id:b.id,status:'paid',paid_at:new Date().toISOString()});
                   if(r) Object.assign(b,r); toast('수납 처리했습니다'); render(); }
              catch(e){ S.err=friendly(e); render(); }
            }},'수납'):null)
          ]);
        }))
      ])) : el('div',{class:'empty'},'청구 내역이 없습니다')
    ])
  ]);
}
function billForm(period){
  const f={kind:'subscription',period,amount:0,status:'unpaid'};
  const fld=(label,node)=>el('div',{class:'field'},[el('label',{},label),node]);
  openModal([
    el('h2',{class:'sec'},'청구 추가'),
    fld('업체', el('select',{class:'inp',onchange:e=>f.vendor_id=e.target.value},
      [el('option',{value:''},'선택')].concat(S.vendors.map(v=>el('option',{value:v.id},v.name))))),
    fld('항목', el('select',{class:'inp',onchange:e=>f.kind=e.target.value},
      [['subscription','월 입점료'],['ad','광고비'],['consult_fee','상담 연결 수수료'],['booking_fee','예약 성사 수수료']]
        .map(([k,l])=>el('option',{value:k},l)))),
    el('div',{style:'display:grid;grid-template-columns:1fr 1fr;gap:10px'},[
      fld('기간', el('input',{class:'inp',value:f.period,placeholder:'2026-08',oninput:e=>f.period=e.target.value})),
      fld('금액(원)', el('input',{class:'inp',inputmode:'numeric',value:0,oninput:e=>f.amount=e.target.value.replace(/[^0-9]/g,'')|0}))
    ]),
    fld('메모', el('input',{class:'inp',oninput:e=>f.memo=e.target.value})),
    el('div',{style:'display:flex;gap:8px;margin-top:14px'},[
      el('button',{class:'btn ghost',style:'flex:1;padding:12px',onclick:closeModal},'취소'),
      el('button',{class:'btn',style:'flex:1;padding:12px',onclick:async()=>{
        if(!f.vendor_id){ toast('업체를 선택해 주세요'); return; }
        try{ const r=await DB.saveBilling(f); if(r) S.billings.unshift(r); closeModal(); toast('청구를 추가했습니다'); render(); }
        catch(e){ closeModal(); S.err=friendly(e); render(); }
      }},'추가')
    ])
  ]);
}

/* ══════════ modal ══════════ */
function openModal(kids){
  const m=$('#modal'); m.innerHTML='';
  (Array.isArray(kids)?kids:[kids]).forEach(k=>{ if(k) m.appendChild(k); });
  $('#mask').classList.add('open');
}
function closeModal(){ $('#mask').classList.remove('open'); }
$('#mask').onclick=e=>{ if(e.target.id==='mask') closeModal(); };
</script>
